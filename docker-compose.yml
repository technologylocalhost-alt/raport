services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raport-app
    environment:
      NODE_ENV: production
      # Supabase connection pooling URL (default untuk runtime)
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres.ylkadmkjyqlijhmsrsqc:password@aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true}
      # Direct connection untuk migrations (jika diperlukan)
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres.ylkadmkjyqlijhmsrsqc:password@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-secret-key}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Memory optimization for Node.js
      NODE_OPTIONS: "--max-old-space-size=384"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./.env:/app/.env
    restart: unless-stopped
    # Resource limits for 1GB RAM VPS
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # Optimized health check
    healthcheck:
      test: ["CMD", "bun", "run", "-e", "fetch('http://localhost:3000/api/health').catch(() => process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Logging configuration to prevent log files from filling disk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
